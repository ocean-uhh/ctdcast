[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ctdcast"
version = "0.1.0"
description = "Self-contained HTML report generator for shipboard CTD and LADCP data"
license = {text = "MIT"}
authors = [{name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com"}]
requires-python = ">=3.10,<3.14"
dependencies = [
    "gsw>=3.6",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "xarray>=2023.1",
    "netcdf4>=1.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/eleanorfrajka/ctdcast"
Source = "https://github.com/eleanorfrajka/ctdcast"
Documentation = "https://eleanorfrajka.github.io/ctdcast"
"Bug Tracker" = "https://github.com/eleanorfrajka/ctdcast/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ctdcast --cov-report=term-missing"
markers = ["slow: marks tests as slow integration tests (deselect with '-m not slow')"]
filterwarnings = ["ignore::RuntimeWarning:importlib"]

[tool.coverage.run]
source = ["ctdcast"]

[project.scripts]
ctdcast = "ctdcast.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ctdcast*"]

[tool.setuptools.package-data]
"ctdcast" = ["*.mplstyle"]
"ctdcast.reports" = ["leaflet/*", "templates/*"]

