[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ctdcast"
version = "0.1.0"
description = "Self-contained HTML report generator for shipboard CTD and LADCP data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com"},
    {name = "Angel Ruiz-Angulo"},
]
keywords = ["oceanography", "CTD", "LADCP", "shipboard", "seawater", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "gsw>=3.6",
    "matplotlib>=3.7",
    "pillow>=9.0",
    "numpy>=1.24",
    "xarray>=2023.1",
    "netcdf4>=1.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/ocean-uhh/ctdcast"
Source = "https://github.com/ocean-uhh/ctdcast"
Documentation = "https://ocean-uhh.github.io/ctdcast"
"Bug Tracker" = "https://github.com/ocean-uhh/ctdcast/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "ARG"]
ignore = [
    "E501",   # line too long — formatter handles this
    "C901",   # complexity — ignored per CLAUDE.md
    "B905",   # zip() strict= audit deferred to a dedicated PR
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]       # pytest fixtures appear unused to ruff
"scripts/*" = ["E402"]    # scripts use late imports for optional deps

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ctdcast --cov-report=term-missing"
markers = ["slow: marks tests as slow integration tests (deselect with '-m not slow')"]
filterwarnings = ["ignore::RuntimeWarning:importlib"]

[tool.coverage.run]
source = ["ctdcast"]

[project.scripts]
ctdcast = "ctdcast.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ctdcast*"]

[tool.setuptools.package-data]
"ctdcast.config" = ["*.mplstyle"]
"ctdcast.reports" = ["leaflet/*", "templates/*"]

