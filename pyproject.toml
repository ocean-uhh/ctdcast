[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oceancast"
version = "0.1.0"
description = "Self-contained HTML report generator for shipboard CTD and LADCP data"
requires-python = ">=3.10"
dependencies = [
    "gsw>=3.6",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "xarray>=2023.1",
    "netcdf4>=1.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "scipy>=1.9",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]

[project.scripts]
oceancast = "ctd_report.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ctd_report*"]

[tool.setuptools.package-data]
ctd_report = ["*.mplstyle", "leaflet/*"]

