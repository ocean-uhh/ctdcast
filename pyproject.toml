[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ctdcast"
version = "0.2.0"
description = "Processing and reporting for shipboard CTD and LADCP data: raw files to QC'd netCDF to self-contained HTML"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com"},
    {name = "Angel Ruiz-Angulo"},
]
keywords = ["oceanography", "CTD", "LADCP", "shipboard", "seawater", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "gsw>=3.6",
    "matplotlib>=3.7",
    "pillow>=9.0",
    "numpy>=1.24",
    "xarray>=2023.1",
    "netcdf4>=1.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/ocean-uhh/ctdcast"
Source = "https://github.com/ocean-uhh/ctdcast"
Documentation = "https://ocean-uhh.github.io/ctdcast"
"Bug Tracker" = "https://github.com/ocean-uhh/ctdcast/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["ctdcast[test,docs]", "ruff>=0.3"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",          # pycodestyle + pyflakes
    "B", "BLE",             # bugbear, blind-except
    "ARG",                  # unused arguments
    "D", "ANN",             # docstrings (numpy convention) + annotations
    "I",                    # import sorting
    "UP",                   # pyupgrade — modern syntax
    "C4",                   # comprehensions
    "RET",                  # return-statement hygiene
    "PIE", "SIM",           # misc lint + simplifications
    "NPY",                  # numpy-specific
    "PTH",                  # pathlib over os.path / open()
    "RUF100",               # unused noqa
]
# No preview rules in `select`.  A select entry for a preview family (FURB, PERF, …) can
# silently start firing new checks on a ruff version bump, which breaks the rule that
# `select` is the source of truth for what is enforced.  Individually-good preview fixes
# are grafted by hand instead (e.g. max(0, x), min(seq), dict.values()).
ignore = [
    "E501",   # line too long — formatter handles this
    "C901",   # complexity — ignored per CLAUDE.md
]
# D417 (undocumented-param) is switched off by the numpy convention below; it is the
# only check that enforces the "numpy sections with full type information" half of the
# convention, so put it back.
extend-select = ["D417"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# tests are not public API — a class-level reason, and the only justification for exempting
# them: no docstring rules (D), no annotations (ANN — documentation-only with no type checker
# configured), no unused-argument rule (ARG — pytest fixtures look unused).  That reason does
# NOT extend to the code-quality rules (I, SIM, PTH, …); tests keep those, as a ratchet.
# CONTRIBUTING.md still asks that a test docstring say which behaviour it asserts — a review
# norm with no lint backing here (D is off), not an oversight.
"tests/*" = ["ARG", "ANN", "D"]
"scripts/*" = ["E402"]    # scripts use late imports for optional deps
# Vendored files, shared across the sibling packages (oceanarray/caldip) — the linter must
# not drive divergence, so RUF100 (noqa managed upstream) and the docstring/annotation rules
# are off here.  The copies currently differ (report_tokens matches all three; _css/_encode
# diverge) and the canonical direction is undecided; any change belongs in the shared source,
# reconciled across the packages together, not made unilaterally by a lint fix here.
"ctdcast/config/report_tokens.py" = ["RUF100", "D", "ANN"]
"ctdcast/reports/_css.py" = ["RUF100", "D", "ANN"]
"ctdcast/reports/_encode.py" = ["RUF100", "D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ctdcast --cov-report=term-missing"
markers = ["slow: marks tests as slow integration tests (deselect with '-m not slow')"]
filterwarnings = ["ignore::RuntimeWarning:importlib"]

[tool.coverage.run]
source = ["ctdcast"]

[project.scripts]
ctdcast = "ctdcast.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ctdcast*"]

[tool.setuptools.package-data]
"ctdcast.config" = ["*.mplstyle"]
"ctdcast.reports" = ["leaflet/*", "templates/*"]

# Per-module coverage floors, checked by scripts/coverage_floors.py after the
# suite.  coverage.py only offers a GLOBAL fail_under, which a new module can
# hide under: three files landing at 40% barely move an aggregate.
#
# No `default` key on purpose -- the aggregate is guarded by --cov-fail-under in
# CI, and repeating that number here would be the same fact in two files.
#
# Seeded at each module's measured coverage, rounded down, so a module can hold
# or rise but never regress.  Improve one, bump its number; the checker prints
# ratchet candidates to make that easy.  The list stays SHORT on purpose -- only
# the stack's blast radius plus new modules -- because pinning ~40 modules is the
# churn that kills these schemes.
[tool.coverage_floors]
# measured 90.77 with seasenselib in the coverage job (the S/m ->mS/cm branch is
# no-cover, as seasenselib now emits mS/cm directly).
"ctdcast/processors/stage1.py"       = 90
"ctdcast/processors/stage2.py"       = 92
"ctdcast/processors/stage3.py"       = 71   # lowest stage file — the refactor should lift it
"ctdcast/processors/profiles.py"     = 97
"ctdcast/processors/__init__.py"     = 97
"ctdcast/config/global_attrs.py"     = 94
"ctdcast/writers/netcdf.py"          = 100
"ctdcast/processors/ladcp.py"        = 85    # measured 85.9
"ctdcast/config/people.py"           = 90    # measured 90.3
# Public module (not _private), so its naming/precedence contract is API surface.
# Pure path logic with no I/O, and it measured 100% (51 stmts, 0 missing) on the
# first pass -- so 100 is the seed, not an aspiration. 95 would have licensed an
# untested branch in the module every other step of the stack rests on.
"ctdcast/processors/stage_layout.py" = 100
# Pure functions over header text, no I/O, measured 100% (93 stmts, 0 missing). 100 is
# the seed, not an aspiration -- the deck-unit advance it recovers is the load-bearing
# finding of the upstream-provenance work, so no branch may go untested.
"ctdcast/config/cnv_header.py"       = 100
# Sensor-block + role reader, seeded here because this is the file the sensor-catalog work
# most changes; measured 94.81%.  Guards the shared <Sensors> parse against regressing.
"ctdcast/readers/metadata.py"        = 94
# Recursive clock-offset segmentation plus a small file reader, measured 100% in CI from
# synthetic series and a tmp_path reader test. The real MSM142 regression is local-only and skips
# on CI, but every branch it would touch is covered synthetically. Same shape as cnv_header.py:
# the recursive step detection is load-bearing (a missed changepoint corrupts a whole segment's
# correction), so no branch may go untested.
"ctdcast/analysis/clock.py"          = 100
# One floor is still deferred: enrich.py does not exist yet, and a floor for a
# file that is not in the coverage report fails as MISSING (verified by running
# the checker) rather than passing quietly -- an unguarded module is the one
# thing this table must never report as passing.
#   branch 4, step 14 adds:
#     "ctdcast/processors/enrich.py" = 90
#       file I/O and error paths; the last 10% is genuinely expensive, so 90.
