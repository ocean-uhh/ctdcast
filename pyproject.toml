[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ctdcast"
version = "0.1.0"
description = "Self-contained HTML report generator for shipboard CTD and LADCP data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com"},
    {name = "Angel Ruiz-Angulo"},
]
keywords = ["oceanography", "CTD", "LADCP", "shipboard", "seawater", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "gsw>=3.6",
    "matplotlib>=3.7",
    "pillow>=9.0",
    "numpy>=1.24",
    "xarray>=2023.1",
    "netcdf4>=1.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/ocean-uhh/ctdcast"
Source = "https://github.com/ocean-uhh/ctdcast"
Documentation = "https://ocean-uhh.github.io/ctdcast"
"Bug Tracker" = "https://github.com/ocean-uhh/ctdcast/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["ctdcast[test,docs]", "ruff>=0.3"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "ARG", "RUF100"]
ignore = [
    "E501",   # line too long — formatter handles this
    "C901",   # complexity — ignored per CLAUDE.md
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]       # pytest fixtures appear unused to ruff
"scripts/*" = ["E402"]    # scripts use late imports for optional deps
# Vendored files (byte-identical with oceanarray) — their noqa directives are managed
# upstream, so RUF100 must not demand edits here that would break byte-identity.
"ctdcast/config/report_tokens.py" = ["RUF100"]
"ctdcast/reports/_css.py" = ["RUF100"]
"ctdcast/reports/_encode.py" = ["RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ctdcast --cov-report=term-missing"
markers = ["slow: marks tests as slow integration tests (deselect with '-m not slow')"]
filterwarnings = ["ignore::RuntimeWarning:importlib"]

[tool.coverage.run]
source = ["ctdcast"]

[project.scripts]
ctdcast = "ctdcast.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ctdcast*"]

[tool.setuptools.package-data]
"ctdcast.config" = ["*.mplstyle"]
"ctdcast.reports" = ["leaflet/*", "templates/*"]

# Per-module coverage floors, checked by scripts/coverage_floors.py after the
# suite.  coverage.py only offers a GLOBAL fail_under, which a new module can
# hide under: three files landing at 40% barely move an aggregate.
#
# No `default` key on purpose -- the aggregate is guarded by --cov-fail-under in
# CI, and repeating that number here would be the same fact in two files.
#
# Seeded at each module's measured coverage, rounded down, so a module can hold
# or rise but never regress.  Improve one, bump its number; the checker prints
# ratchet candidates to make that easy.  The list stays SHORT on purpose -- only
# the stack's blast radius plus new modules -- because pinning ~40 modules is the
# churn that kills these schemes.
[tool.coverage_floors]
"ctdcast/processors/stage1.py"       = 88
"ctdcast/processors/stage2.py"       = 92
"ctdcast/processors/stage3.py"       = 71   # lowest stage file — the refactor should lift it
"ctdcast/processors/profiles.py"     = 97
"ctdcast/processors/__init__.py"     = 97
"ctdcast/config/global_attrs.py"     = 94
"ctdcast/writers/netcdf.py"          = 100
"ctdcast/processors/ladcp.py"        = 85    # measured 85.9
"ctdcast/config/people.py"           = 90    # measured 90.3
# Public module (not _private), so its naming/precedence contract is API surface.
# Pure path logic with no I/O, and it measured 100% (51 stmts, 0 missing) on the
# first pass -- so 100 is the seed, not an aspiration. 95 would have licensed an
# untested branch in the module every other step of the stack rests on.
"ctdcast/processors/stage_layout.py" = 100
# One floor is still deferred: enrich.py does not exist yet, and a floor for a
# file that is not in the coverage report fails as MISSING (verified by running
# the checker) rather than passing quietly -- an unguarded module is the one
# thing this table must never report as passing.
#   branch 3, step 14 adds:
#     "ctdcast/processors/enrich.py" = 90
#       file I/O and error paths; the last 10% is genuinely expensive, so 90.
