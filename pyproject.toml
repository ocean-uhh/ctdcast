[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ctd_report"
version = "0.0.1"
description = "Self-contained HTML report generator for shipboard CTD data"
requires-python = ">=3.10"
dependencies = [
    "gsw>=3.6",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "xarray>=2023.1",
    "netcdf4>=1.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "scipy>=1.9",
]

[project.scripts]
ctdreport = "ctd_report.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ctd_report*"]

[tool.setuptools.package-data]
ctd_report = ["*.mplstyle", "leaflet/*"]

