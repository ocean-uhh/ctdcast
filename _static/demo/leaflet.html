var SHIP_TRACK   = [];
var DATA_BOUNDS  = [[65.5833, -29.58835], [65.86036, -29.43298]];

var map = L.map('map', { zoomSnap: 0.25, zoomControl: false });
L.control.zoom({ position: 'topright' }).addTo(map);
// Expand the initial view longitude so the map fills a widescreen without
// large empty side margins.  At latitude φ, 1° lon = cos(φ) × 1° lat in
// Mercator distance.  We compute the lon span needed to fill the viewport at
// the screen aspect ratio and use whichever is wider.
(function() {
  var meanLat = (DATA_BOUNDS[0][0] + DATA_BOUNDS[1][0]) / 2;
  var cosLat  = Math.cos(meanLat * Math.PI / 180);
  var dataLatSpan = DATA_BOUNDS[1][0] - DATA_BOUNDS[0][0];
  var dataLonSpan = DATA_BOUNDS[1][1] - DATA_BOUNDS[0][1];
  var screenAspect = window.innerWidth / Math.max(1, window.innerHeight);
  var targetLonSpan = Math.max(
    dataLonSpan + 4.0,
    screenAspect * 1.4 * dataLatSpan / cosLat
  );
  var midLon = (DATA_BOUNDS[0][1] + DATA_BOUNDS[1][1]) / 2;
  var viewBounds = [
    [DATA_BOUNDS[0][0], midLon - targetLonSpan / 2],
    [DATA_BOUNDS[1][0], midLon + targetLonSpan / 2]
  ];
  map.fitBounds(viewBounds, { padding: [20, 20] });
})();

if (GEBCO_B64) {
  L.imageOverlay('data:image/png;base64,' + GEBCO_B64, GEBCO_BOUNDS, {
    opacity: 1.0, interactive: false
  }).addTo(map);
}

if (CONTOURS) {
  L.geoJSON(CONTOURS, {
    interactive: false,
    style: function(feature) {
      var major = feature.properties.major;
      return {
        color: '#1a1a2e',
        weight: major ? 1.2 : 0.4,
        opacity: major ? 0.6 : 0.35,
      };
    }
  }).addTo(map);
}

if (SHIP_TRACK && SHIP_TRACK.length > 1) {
  L.polyline(SHIP_TRACK, {
    color: '#888', weight: 1.5, opacity: 0.45, interactive: false
  }).addTo(map);
}

var panel = document.getElementById('info-panel');
function showPanel(html) {
  panel.className = '';
  panel.innerHTML = html;
}

SECTIONS.forEach(function(s) {
  L.polyline(s.latlons, { color: s.color, weight: 3, opacity: 0.85 })
    .on('mouseover', function() { showPanel(s.info); })
    .on('click',     function() { window.location.href = s.url; })
    .addTo(map);
});

CASTS.forEach(function(c) {
  L.circleMarker([c.lat, c.lon], {
    radius: 7, color: 'white', weight: 1.5, fillColor: c.color, fillOpacity: 0.92
  })
    .on('mouseover', function() { showPanel(c.info); })
    .on('click',     function() { window.location.href = c.url; })
    .addTo(map);

  // Cast number label offset just to the right of the dot
  L.marker([c.lat, c.lon], {
    icon: L.divIcon({
      className: '',
      html: '<span class="cast-label">' + c.num + '</span>',
      iconAnchor: [-9, 4],
    }),
    interactive: false,
    keyboard: false,
  }).addTo(map);
});
