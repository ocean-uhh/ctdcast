name: Run tests

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'ctdcast/**/*.yaml'
      - 'ctdcast/**/*.mplstyle'
      - 'ctdcast/**/templates/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'ctdcast/**/*.yaml'
      - 'ctdcast/**/*.mplstyle'
      - 'ctdcast/**/templates/**'

jobs:
  test:
    name: ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Ubuntu covers the full Python range; macOS and Windows run one version
        # (3.11) only — they catch platform issues, not version issues.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Debug Python version
        run: |
          python --version
          python -c "import sys; print(f'Python {sys.version}')"
          which python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "ruamel.yaml>=0.18" --prefer-binary

      - name: Install package
        run: |
          python -m pip install -e ".[test]" --prefer-binary

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          ruff check .

      - name: Test with pytest
        run: |
          pytest -m "not slow"

  integration:
    name: Integration tests / ubuntu / Py 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "ruamel.yaml>=0.18" --prefer-binary

      - name: Install package
        run: |
          python -m pip install -e ".[test]" --prefer-binary

      - name: Integration tests
        run: |
          pytest tests/integration/ -v --no-cov

  coverage:
    name: Coverage gate / ubuntu / Py 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "ruamel.yaml>=0.18" --prefer-binary

      - name: Install package
        run: |
          python -m pip install -e ".[test]" --prefer-binary

      - name: All tests with coverage gate
        run: |
          pytest --cov-fail-under=70
