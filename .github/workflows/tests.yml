name: Run tests

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'ctdcast/**/*.yaml'
      - 'ctdcast/**/*.mplstyle'
      - 'ctdcast/**/templates/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'ctdcast/**/*.yaml'
      - 'ctdcast/**/*.mplstyle'
      - 'ctdcast/**/templates/**'

jobs:
  test:
    name: ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # 3.14 is tested but allowed to fail: it is the next release, so a wheel for a
    # dependency may lag; a red 3.14 cell must not block a merge.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: true
      matrix:
        # Ubuntu covers the full Python range; macOS and Windows run one version
        # (3.11) only — they catch platform issues, not version issues.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Debug Python version
        run: |
          python --version
          python -c "import sys; print(f'Python {sys.version}')"
          which python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "ruamel.yaml>=0.18" --prefer-binary

      - name: Install package
        run: |
          python -m pip install -e ".[test]" --prefer-binary

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          ruff check .
          ruff format --check .

      - name: Test with pytest
        # --no-cov: the matrix cells check platform/version behaviour, not coverage.
        # Coverage (and its fail-under gate) run in the dedicated `coverage` job below,
        # so tracing here is pure overhead -- ~1.8x on the I/O-heavy pipeline tests, which
        # dominates the slow Windows cell.
        # -n auto: distribute across the runner's cores (pytest-xdist). The suite is
        # CPU-bound on matplotlib renders and has no cross-test ordering dependencies, so
        # this is a ~2.5x local win and cuts the slow Windows cell the most.
        env:
          # Windows: the netCDF4 wheel points HDF5_PLUGIN_PATH at its bundled plugins
          # folder, and HDF5 rescans it on every filter query -- xarray calls var.filters()
          # once per variable, so each NETCDF4 open costs ~36 ms/variable on the hosted
          # runner. "::" preloads no plugins. ctdcast writes zlib (built into HDF5), so
          # only zstd/bzip2/blosc files would need them -- none here. No effect on
          # Linux/macOS, where plugin scanning is not the bottleneck.
          HDF5_PLUGIN_PRELOAD: "::"
        run: |
          pytest -m "not slow" --no-cov -n auto

  integration:
    name: Integration tests / ubuntu / Py 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "ruamel.yaml>=0.18" --prefer-binary

      - name: Install package
        run: |
          python -m pip install -e ".[test]" --prefer-binary

      - name: Integration tests
        run: |
          pytest tests/integration/ -v --no-cov

  coverage:
    name: Coverage gate / ubuntu / Py 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "ruamel.yaml>=0.18" --prefer-binary

      - name: Install package
        run: |
          python -m pip install -e ".[test]" --prefer-binary

      - name: All tests with coverage gate
        run: |
          pytest --cov-fail-under=84

      - name: Per-module coverage floors
        run: |
          coverage json -o coverage.json
          python scripts/coverage_floors.py
