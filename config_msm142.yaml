# ctdreport configuration — generated by ctdreport init --interactive
# Run 'ctdreport validate config.yaml' to check all paths before the first run.

data:
  cnv_dir: /Volumes/T9ifmeo/msm142/CTD/for_use_uncalibrated
  cnv_pattern: msm*1sec.cnv
  nc_dir: /Volumes/T9ifmeo/msm142/nc
  profiles_nc: /Volumes/T9ifmeo/msm142/nc/profiles.nc
  section_yaml: config/ctd_sections_draft.yaml
  ladcp_dir: /Volumes/T9ifmeo/msm142/LADCP/preproc/msm_142_1/results/profiles
  ladcp_pattern: msm_142_1_*.mat
  # ship_track: /path/to/ship_track.nc
  gebco_nc: ../cruiseplan/data/bathymetry/GEBCO_2025.nc

output:
  dir: outputs/ctd_msm142

generate:
  stations: true
  sections: true
  timeseries: true
  index: true
  leaflet: true

cruise_info:
  name: "msm142"
  ship: "MS Merian"
  chief_scientist: "Fehmi Dilmahamod"
  start_date: "2026-03-27"
  end_date: "2026-05-11"

display:
  section_style: pcolormesh
  timeseries_style: pcolormesh
